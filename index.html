<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QADAM — твой проводник по Казахстану</title>
<meta name="author" content="Ерсултан">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Michroma&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#060c17; --bg2:#0a1322; --card:#0d182a; --card2:#122038; --line:#1b2c48;
  --txt:#eaf2fc; --mut:#8395b1; --acc:#9fd3ff; --acc-ink:#06182b;
  --ok:#3ddc97; --red:#ef4a55; --amber:#f2b84b; --cyan:#37e6f0;
  --top:52px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
*{margin:0;-webkit-tap-highlight-color:transparent}
body{min-height:100%;background:#040810;color:var(--txt);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{flex:none;display:block}

/* ---------- stage ---------- */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:88px;padding:24px;
  background:radial-gradient(900px 600px at 78% 18%,rgba(40,110,200,.20),transparent 60%),radial-gradient(700px 500px at 12% 90%,rgba(30,180,200,.10),transparent 60%),#040810}
.pitch{width:340px;flex:none}
.pitch .logo{display:flex;align-items:center;gap:14px;font-family:'Michroma',sans-serif;font-size:34px;letter-spacing:.14em;color:#fff}
.pitch .logo svg{color:var(--acc)}
.pitch h2{margin:26px 0 12px;font-size:24px;font-weight:800;line-height:1.25}
.pitch p{color:var(--mut);font-size:15px;line-height:1.6}
.pitch ul{list-style:none;padding:0;margin:26px 0;display:grid;gap:14px}
.pitch li{display:flex;gap:14px;align-items:flex-start;color:#c4d3e8;font-size:14px}
.pitch li .ib{width:36px;height:36px;border-radius:12px;background:#0e1b31;border:1px solid var(--line);display:grid;place-items:center;color:var(--acc);flex:none}
.pitch .restart{margin-top:6px;height:44px;padding:0 20px;border-radius:14px;border:1px solid #2a4468;color:var(--acc);font-weight:700;display:inline-flex;align-items:center;gap:10px}
.pitch .restart:hover{background:#0e1b31}

.phone{position:relative;flex:none;width:392px;height:min(844px,calc(100vh - 32px));border-radius:48px;background:var(--bg);
  border:1px solid #243858;box-shadow:0 0 0 9px #0a1220,0 0 0 10px #1a2a44,0 50px 140px rgba(30,100,200,.28);overflow:hidden;isolation:isolate}
.sb{position:absolute;z-index:40;top:0;left:0;right:0;height:46px;padding:16px 30px 0;display:flex;justify-content:space-between;font-weight:700;font-size:14px;pointer-events:none}
.phone:not([data-screen=splash]):not([data-screen=cam]):not([data-screen=place]):not([data-screen=map]):not([data-screen=sos]) .sb{background:linear-gradient(var(--bg) 62%,transparent)}
.sb .r{display:flex;gap:6px;align-items:center}
.phone[data-screen=splash] .sb,.phone[data-screen=cam] .sb{color:#fff}

@media (max-width:1000px){.pitch{display:none}}
@media (max-width:520px){
  :root{--top:14px}
  .stage{display:block;padding:0;min-height:0}
  .phone{width:100%;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border-radius:0;border:0;box-shadow:none}
  .sb{display:none}
}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:124px;opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .28s,transform .28s,visibility 0s .28s;scrollbar-width:none;background:var(--bg)}
.screen::-webkit-scrollbar{display:none}
.screen.on{opacity:1;visibility:visible;transform:none;transition:opacity .28s,transform .28s}
.pad{padding:0 20px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:var(--top) 20px 10px;min-height:calc(var(--top) + 44px)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Michroma',sans-serif;font-size:17px;letter-spacing:.16em;color:#fff}
.brand svg{color:#fff}
.row{display:flex;align-items:center;gap:10px}
.icb{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#c9d8ee;background:transparent}
.icb:hover{background:#0f1b2f}
.icb.bg{background:rgba(8,16,30,.72);border:1px solid #223655;backdrop-filter:blur(8px)}
.sos-chip{width:auto;padding:0 14px;height:34px;border-radius:999px;background:rgba(239,74,85,.14);border:1px solid rgba(239,74,85,.5);color:#ff8790;font-weight:800;letter-spacing:.06em;font-size:13px}
.h1{font-size:25px;font-weight:800;line-height:1.2;margin-top:10px}
.sub{color:#b6c5db;font-size:16px;margin-top:4px}
h2.sec{font-size:17px;font-weight:800;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec small{font-size:13px;color:var(--mut);font-weight:600}
.search{display:flex;align-items:center;gap:12px;margin-top:20px;height:50px;padding:0 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px;color:var(--txt)}
.search:focus-within{border-color:#3a6a9c}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.cat{height:88px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:#dbe7f7;font-size:11.5px;font-weight:600;text-align:center;line-height:1.15;padding:0 4px}
.cat svg{color:#cfe2f8}
.cat:hover{border-color:#37608f;background:var(--card2)}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px}
.near{position:relative;overflow:hidden;margin-top:18px;padding:18px;min-height:150px}
.near .txt{position:relative;z-index:2;max-width:56%}
.near h3{font-size:18px;font-weight:800}
.near .st{display:flex;align-items:center;gap:8px;margin:8px 0 14px;color:#b6c5db;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);flex:none}
.dot.amber{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.near .dimg{position:absolute;right:-26px;top:14px;width:64%;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 18px 20px rgba(0,0,0,.5))}
.near .ring{position:absolute;right:-40px;top:-30px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(70,160,255,.22),transparent 65%)}
@keyframes float{50%{transform:translateY(-7px) rotate(-.8deg)}}

.btn{height:54px;border-radius:18px;background:var(--acc);color:var(--acc-ink);font-weight:800;display:flex;gap:10px;align-items:center;justify-content:center;width:100%;font-size:15px;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn.sm{height:40px;width:auto;padding:0 18px;border-radius:14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid #2a4468}
.btn.red{background:var(--red);color:#fff}

.feat{position:relative;display:block;width:100%;height:150px;border-radius:22px;overflow:hidden;margin-top:14px;border:1px solid var(--line)}
.feat .sc,.pc .sc{position:absolute;inset:0}
.feat::after,.pc::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(4,10,20,.92),rgba(4,10,20,.05) 65%)}
.feat .t{position:absolute;z-index:2;left:16px;right:44px;bottom:14px}
.feat .t b{font-size:21px;font-weight:800;display:block}
.feat .t span{font-size:13px;color:#c2d1e6}
.feat .chev{position:absolute;z-index:2;right:14px;bottom:20px}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .7s}
.ph.in{opacity:1}
.th,.ava .sc{position:relative}
.sc svg,.th svg{display:block;width:100%;height:100%}

.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pc{position:relative;flex:none;width:158px;height:190px;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.pc .t{position:absolute;z-index:2;left:12px;right:12px;bottom:12px}
.pc .t b{display:block;font-size:15px;font-weight:800}
.pc .t span{font-size:12px;color:#c2d1e6;display:flex;align-items:center;gap:5px;margin-top:2px}

.stn{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);width:100%;margin-bottom:10px}
.stn .ib{width:42px;height:42px;border-radius:13px;background:#0e2036;display:grid;place-items:center;color:var(--acc);flex:none}
.stn .m{flex:1;min-width:0}
.stn b{display:block;font-size:14.5px}
.stn span{font-size:12.5px;color:var(--mut)}
.stn .n{font-weight:800;color:var(--ok);font-size:13px;text-align:right}

/* ---------- ad block ---------- */
.adwrap{position:relative;margin-top:12px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/9}
.adwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.adtag{position:absolute;z-index:2;top:10px;left:10px;background:rgba(6,12,23,.65);color:#fff;font-size:11px;font-weight:800;letter-spacing:.05em;padding:5px 11px;border-radius:999px;backdrop-filter:blur(6px)}
.adsound{position:absolute;z-index:2;bottom:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(6,12,23,.65);display:grid;place-items:center;color:#fff;backdrop-filter:blur(6px)}
.adsound.on{color:var(--acc)}
.adfallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 30px;color:var(--mut);font-size:12.5px;line-height:1.5}
.adfallback svg{color:#42597e}
.adwrap.err video{display:none}
.adwrap.err .adfallback{display:flex}
.adwrap.err .adsound{display:none}

/* ---------- tab bar ---------- */
.tabbar{position:absolute;z-index:30;left:0;right:0;bottom:0;height:88px;padding:0 8px 12px;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end;
  background:rgba(7,14,26,.94);backdrop-filter:blur(14px);border-top:1px solid #172741;transition:transform .35s}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;color:#7f92ae;font-size:11px;font-weight:600}
.tab.on{color:var(--acc)}
.tab.on svg{filter:drop-shadow(0 0 8px rgba(120,200,255,.55))}
.tabc{justify-self:center;align-self:start;margin-top:-24px;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#12233b,#08111f);border:1.5px solid #2b4a72;display:grid;place-items:center;color:#fff;box-shadow:0 0 28px rgba(80,170,255,.28)}
.tabc.on{border-color:var(--acc);box-shadow:0 0 34px rgba(100,190,255,.5)}
.phone[data-screen=splash] .tabbar,.phone[data-screen=place] .tabbar,.phone[data-screen=sos] .tabbar,.phone[data-screen=translate] .tabbar,.phone[data-screen=about] .tabbar,.phone[data-screen=cam] .tabbar{transform:translateY(120%)}

/* ---------- splash ---------- */
#splash{position:absolute;inset:0;z-index:50;background:#0b1a2e;transition:opacity .7s,visibility 0s .7s;overflow:hidden}
#splash.off{opacity:0;visibility:hidden;pointer-events:none}
#splash .sc{position:absolute;inset:0}
#splash::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(6,14,28,.35),rgba(6,14,28,0) 30%,rgba(6,14,28,0) 62%,rgba(5,10,20,.85))}
#splash .lg{position:absolute;z-index:3;top:16%;left:0;right:0;text-align:center}
#splash .lg svg{color:#fff;filter:drop-shadow(0 4px 18px rgba(0,0,0,.4))}
#splash .lg b{display:block;margin-top:14px;font-family:'Michroma',sans-serif;font-size:36px;letter-spacing:.2em;font-weight:400;padding-left:.2em;text-shadow:0 4px 24px rgba(0,0,0,.45)}
#splash .lg span{display:block;margin-top:12px;font-size:14.5px;color:#e4eefb;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#splash .fly{position:absolute;z-index:3;left:50%;top:41%;width:76%;margin-left:-38%;animation:float 4.5s ease-in-out infinite;filter:drop-shadow(0 34px 26px rgba(0,0,0,.5))}
#splash .ft{position:absolute;z-index:3;left:0;right:0;bottom:8%;text-align:center;font-size:14px;color:#e6effb}
#splash .bar{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.22);margin:16px auto 0;overflow:hidden}
#splash .bar i{display:block;height:100%;width:0;background:#fff;border-radius:3px;animation:load 2.9s cubic-bezier(.5,.1,.3,1) forwards}
@keyframes load{to{width:100%}}

/* ---------- drone screen ---------- */
.dhero{position:relative;height:196px;margin:0 -20px;display:grid;place-items:center}
.dhero .glow{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(60,150,255,.30),transparent 62%)}
.dhero .orb{position:absolute;width:270px;height:270px;border-radius:50%;border:1px dashed rgba(120,190,255,.30);animation:spin 40s linear infinite}
.dhero .orb.b{width:212px;height:212px;border-color:rgba(120,190,255,.16);animation-duration:26s;animation-direction:reverse}
.dhero img{position:relative;width:296px;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 26px 22px rgba(0,0,0,.55))}
@keyframes spin{to{transform:rotate(360deg)}}
.dname{text-align:center;font-size:22px;font-weight:800;margin-top:6px}
.dst{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px;color:#9fdcbc;font-size:13.5px;font-weight:600}
.dst.amber{color:#f5cf85}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0 16px}
.stats div{text-align:center;position:relative}
.stats div+div::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line)}
.stats b{display:flex;justify-content:center;align-items:center;gap:8px;font-size:15px}
.stats b svg{color:var(--acc)}
.stats span{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.caps{margin-top:18px;border-radius:22px;background:var(--card);border:1px solid var(--line);padding:14px 12px}
.caps h3{font-size:14px;color:#b6c5db;font-weight:700;padding:0 6px 10px}
.cap{display:flex;align-items:center;gap:14px;width:100%;padding:12px 10px;border-radius:14px;background:#101d33;margin-bottom:8px;transition:background .15s}
.cap:hover{background:#15264190}
.cap:last-child{margin-bottom:0}
.cap .ci{width:32px;height:32px;display:grid;place-items:center;color:#d3e4f8}
.cap b{flex:1;font-weight:600;font-size:14.5px}
.cap .chv{color:#6f829f}
.tg{width:44px;height:26px;border-radius:99px;background:#1c2f4d;position:relative;transition:background .2s;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#7f95b5;transition:transform .2s,background .2s}
.tg.on{background:#2b78c0}
.tg.on::after{transform:translateX(18px);background:#fff}

/* ---------- places ---------- */
.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:6px 20px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 22px;border-radius:999px;background:#0f1b2f;border:1px solid var(--line);color:#9fb0c8;font-weight:600;display:flex;align-items:center;gap:8px}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:800}
.pl{display:flex;align-items:center;gap:14px;width:100%;padding:12px;border-radius:20px;background:var(--card);border:1px solid var(--line);margin-bottom:12px;transition:border-color .15s}
.pl:hover{border-color:#37608f}
.pl .th{width:82px;height:82px;border-radius:14px;overflow:hidden;flex:none}
.pl .m{flex:1;min-width:0}
.pl b{display:block;font-size:16.5px;font-weight:700}
.pl .meta{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12.5px;margin:4px 0 6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.pill.easy{color:#54e2a6;background:rgba(61,220,151,.10)}
.pill.mid{color:var(--acc);background:rgba(159,211,255,.10)}
.pill.hard{color:#ff7b85;background:rgba(239,74,85,.12)}
.empty{text-align:center;color:var(--mut);padding:50px 20px}

/* ---------- place detail ---------- */
#s-place{padding-bottom:110px}
.hero{position:relative;height:318px}
.hero .sc{position:absolute;inset:0}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 2%,rgba(6,12,23,.55) 32%,rgba(6,12,23,0) 62%)}
.hero .tb{position:absolute;z-index:3;top:var(--top);left:20px;right:20px;display:flex;justify-content:space-between}
.hero .tt{position:absolute;z-index:3;left:20px;right:20px;bottom:6px}
.hero h1{font-size:29px;font-weight:800}
.hero .sb2{font-size:16px;color:#c9d7ea;margin-top:2px}
.rate{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.rate svg{color:var(--amber);fill:var(--amber)}
.rate span{color:var(--mut)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin:20px 0}
.facts div{display:flex;flex-direction:column;gap:2px;padding:0 6px;text-align:center;position:relative}
.facts div+div::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:var(--line)}
.facts svg{margin:0 auto 6px;color:var(--acc)}
.facts b{font-size:16px}
.facts span{font-size:11.5px;color:var(--mut)}
.desc{color:#bfcde1;font-size:14.5px;line-height:1.65}
.tip{display:flex;gap:12px;margin-top:18px;padding:14px;border-radius:18px;background:#0d2138;border:1px solid #1c3a5e}
.tip svg{color:var(--acc);margin-top:2px}
.tip b{display:block;font-size:13.5px;margin-bottom:2px}
.tip span{font-size:13.5px;color:#bcd0e8;line-height:1.55}
.cta{position:sticky;bottom:20px;margin-top:22px}

/* ---------- map ---------- */
#s-map{padding:0;overflow:hidden}
.mapwrap{position:absolute;inset:0;background:#08141f}
.mapwrap svg{width:100%;height:100%;display:block}
.mhd{position:absolute;z-index:4;top:0;left:0;right:0;padding:var(--top) 20px 30px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(6,12,23,.95),rgba(6,12,23,0))}
.mhd h1{font-size:22px;font-weight:800}
.mctl{position:absolute;z-index:4;right:16px;top:calc(var(--top) + 64px);display:grid;gap:10px}
.demo{position:absolute;z-index:4;left:16px;top:calc(var(--top) + 66px);height:38px;padding:0 14px;border-radius:12px;background:rgba(8,16,30,.78);border:1px solid #223655;backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;color:#ffb0b6;font-size:12.5px;font-weight:700}
.mcard{position:absolute;z-index:4;left:14px;right:14px;bottom:100px;padding:14px;border-radius:22px;background:rgba(9,17,31,.92);backdrop-filter:blur(14px);border:1px solid #1e3352}
.mcard .r1{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.mcard .th{width:76px;height:62px;border-radius:12px;overflow:hidden;flex:none}
.mcard b{font-size:16px;display:flex;align-items:center;gap:8px}
.mcard span.mt{display:flex;gap:8px;align-items:center;color:#a9bad2;font-size:13px;margin-top:5px}
.route-glow{filter:drop-shadow(0 0 6px rgba(55,230,240,.9))}
.flow{animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.pulse{animation:pulse 2.2s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}
.mk:hover circle:nth-child(2){fill:#10233b}

/* ---------- translate ---------- */
#s-translate{display:flex;flex-direction:column;padding-bottom:0}
